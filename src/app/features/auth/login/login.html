<div class="page">
  <div class="card login-card">
    <div class="brand">
      <span class="brand-icon">💬</span>
      <h1 class="brand-title">Wisber</h1>
      <p class="brand-sub">Control Panel</p>
    </div>

    @if (error()) { <div class="alert alert-error">{{ error() }}</div> }

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input class="form-control" type="tel" placeholder="e.g. 447460726920"
               [ngModel]="phone()" (ngModelChange)="phone.set($event)" name="phone" required />
      </div>
      <div class="form-group" style="margin-top:16px">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" placeholder="••••••••"
               [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" required />
      </div>
      <button class="btn btn-primary btn-lg" style="width:100%;margin-top:24px;justify-content:center"
              type="submit" [disabled]="loading()">
        {{ loading() ? "Signing in..." : "Sign In" }}
      </button>
    </form>
  </div>
</div>
